server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Anything under /api goes to the Python API.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        client_max_body_size 20m;
    }

    # Built files have hashed names, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The UI is a single-page app: unknown paths fall back to index.html
    # so React can handle the route.
    location / {
        try_files $uri /index.html;
    }
}
